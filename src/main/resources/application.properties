# Database Configuration (H2 for development)
quarkus.datasource.db-kind=h2
quarkus.datasource.username=sa
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:h2:mem:taskdb

# Hibernate Configuration
quarkus.hibernate-orm.database.generation=drop-and-create
quarkus.hibernate-orm.log.sql=true

# HTTP Configuration
quarkus.http.port=8080

# Dev UI (Access at http://localhost:8080/q/dev/)
quarkus.dev-ui.always-show=true

# Logging
quarkus.log.level=INFO
quarkus.log.console.enable=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n

# JWT Configuration
mp.jwt.verify.issuer=https://workdflowCore.com/issuer
quarkus.smallrye-jwt.enabled=true

# For development - auto-generate keys
%dev.smallrye.jwt.new-token.issuer=https://workdflowCore.com/issuer
%dev.smallrye.jwt.new-token.lifespan=86400

# Security
quarkus.http.auth.basic=false